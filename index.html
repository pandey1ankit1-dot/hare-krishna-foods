<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hare Krishna Foods</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fffaf0;
color:#173d2b;
}

header{
background:linear-gradient(135deg,#075b35,#0b7a43);
color:white;
padding:22px 16px;
text-align:center;
}

header h1{margin:0;font-size:30px}
header p{margin:7px 0 0;font-size:15px}

.hero{
padding:30px 18px;
text-align:center;
background:#fff3c7;
}

.hero h2{
font-size:28px;
margin:5px 0 10px;
color:#9b3d13;
}

.hero p{
font-size:17px;
line-height:1.5;
}

.products{
padding:25px 15px;
max-width:600px;
margin:auto;
}

.products h2{
text-align:center;
color:#075b35;
margin-bottom:22px;
}

.card{
background:white;
border-radius:16px;
padding:15px;
box-shadow:0 4px 15px #0002;
text-align:center;
}

.photo{
height:220px;
border-radius:12px;
background:#f4e7c5;
display:flex;
align-items:center;
justify-content:center;
}

.photo img{
width:80%;
height:90%;
object-fit:contain;
border-radius:12px;
}

.card h3{
margin:14px 0 6px;
color:#8b3510;
}

.price{
font-size:21px;
font-weight:bold;
color:#075b35;
margin:10px;
}

.quantity{
margin:15px 0;
}

.quantity button{
width:42px;
height:42px;
border:none;
border-radius:8px;
background:#128c4b;
color:white;
font-size:22px;
}

.quantity span{
margin:0 15px;
font-size:20px;
font-weight:bold;
}

.form{
margin-top:20px;
text-align:left;
}

.form label{
display:block;
font-weight:bold;
margin:12px 0 5px;
}

.form input,
.form textarea,
.form select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.form textarea{
height:80px;
resize:none;
}

.order{
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:25px;
background:#25D366;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.about{
background:#f5e9c9;
padding:28px 18px;
text-align:center;
}

.about h2{color:#075b35}

.contact{
padding:28px 18px;
text-align:center;
}

footer{
background:#123b29;
color:white;
text-align:center;
padding:18px;
font-size:14px;
}
</style>
</head>

<body>

<header>
<h1>🦚 Hare Krishna Foods</h1>
<p>शुद्ध स्वाद • बेहतरीन गुणवत्ता • हर खुशी के लिए</p>
</header>

<section class="hero">
<h2>स्वाद जो दिल में बस जाए ❤️</h2>
<p>
Hare Krishna Foods में आपको स्वादिष्ट और गुणवत्तापूर्ण
खाद्य उत्पाद मिलेंगे।
</p>
</section>

<section class="products">

<h2>🛍️ हमारे Products</h2>

<div class="card">

<div class="photo">
<img src="Product-1.jpg" alt="Hare Krishna Khurma">
</div>

<h3>Hare Krishna Khurma</h3>

<p>करारा और स्वादिष्ट खुरमा</p>

<div class="price">
₹50 / पैकेट
</div>

<div class="quantity">

<button onclick="changeQty(-1)">−</button>

<span id="qty">1</span>

<button onclick="changeQty(1)">+</button>

</div>

<div class="price">
Total: ₹<span id="total">50</span>
</div>

<div class="form">

<label>👤 आपका नाम</label>
<input type="text" id="name" placeholder="अपना नाम लिखें">
